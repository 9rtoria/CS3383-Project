# Production profile: run behind a TLS-terminating reverse proxy.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Optional integrations. Configure through environment variables; never commit secrets.
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# APPLE_CLIENT_ID, APPLE_CLIENT_SECRET
# SMTP host/user/password via SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
