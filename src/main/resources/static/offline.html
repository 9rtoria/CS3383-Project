<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Drift</title>
  <meta name="theme-color" content="#2f6b56">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="main" class="offline-page">
    <section class="card offline-card">
      <div class="empty-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      </div>
      <p class="eyebrow">No connection</p>
      <h1 class="page-title">You’re offline</h1>
      <p class="page-sub">Drift could not reach the server. Reopen the app once you are back online; anything you captured while the tab was open is kept on this device and will retry automatically.</p>
      <div class="invite-actions">
        <a class="btn primary" href="/">Try again</a>
      </div>
    </section>
  </main>
</body>
</html>
